theme = "tokyonight_storm"

[editor]
line-number = "relative"
cursorline = true
color-modes = true
true-color = true
bufferline = "multiple"
auto-format = true
rulers = [100]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator"]
right = ["diagnostics", "selections", "position", "file-encoding", "file-type"]

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true
character = "┊"

# Ctrl+s to save (VS Code muscle memory). Comment toggle (Ctrl+c) is a Helix default.
[keys.normal]
C-s = ":w"

[keys.insert]
C-s = ":w"
